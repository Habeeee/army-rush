
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Army Rush: Zombie Survival</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#17231c;color:white;
 font-family:Arial,sans-serif;
 touch-action:none;
}
#game{position:fixed;inset:0}
canvas{display:block}
#ui{
 position:fixed;inset:0;
 pointer-events:none;
 padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
}
.top{
 display:flex;justify-content:space-between;
 gap:6px;padding-top:9px;
}
.panel{
 background:rgba(15,22,29,.88);
 border:1px solid #ffffff22;
 border-radius:11px;
 padding:9px 10px;
 font-size:12px;font-weight:bold;
 backdrop-filter:blur(9px);
 box-shadow:0 4px 14px #0004;
}
.panel span{color:#e9b957}
#bars{
 position:absolute;top:54px;left:12px;right:12px;
 display:flex;flex-direction:column;gap:5px;
}
.barline{
 display:flex;align-items:center;gap:7px;
 font-size:10px;font-weight:bold;
 text-shadow:0 2px 4px #000;
}
.bar{
 height:7px;flex:1;
 background:#111a;
 border-radius:8px;overflow:hidden;
 border:1px solid #ffffff22;
}
.fill{height:100%;width:100%;background:#d34d4d}
#baseFill{background:#d6a642}
#waveFill{background:#5eae7b}
#controls{
 position:absolute;bottom:18px;left:0;right:0;
 display:flex;justify-content:space-between;
 align-items:end;padding:0 12px;
}
#stick{
 width:105px;height:105px;
 border-radius:50%;
 background:#17232c99;
 border:1px solid #ffffff55;
 position:relative;pointer-events:auto;
 backdrop-filter:blur(8px);
}
#knob{
 width:43px;height:43px;
 border-radius:50%;
 background:linear-gradient(145deg,#dce0e4,#727d87);
 border:2px solid #ffffff88;
 position:absolute;left:30px;top:30px;
 box-shadow:0 3px 10px #0007;
}
.shop{
 display:flex;flex-direction:column;
 gap:6px;width:139px;
 pointer-events:auto;
}
button{
 border:1px solid #ffffff25;
 border-radius:10px;
 padding:11px 7px;
 background:linear-gradient(135deg,#344351,#202b35);
 color:white;font-size:11px;
 font-weight:bold;
 box-shadow:0 3px 10px #0005;
}
button:active{transform:scale(.96)}
button.gold{
 background:linear-gradient(135deg,#b78b3e,#77551e);
 border-color:#e5bd6a88;
}
button:disabled{opacity:.45}
#hint{
 position:absolute;bottom:137px;
 width:100%;text-align:center;
 color:#ffffffa8;font-size:10px;
 letter-spacing:.5px;
}
#message{
 position:absolute;inset:0;
 display:none;align-items:center;
 justify-content:center;
 flex-direction:column;
 background:#07100dcc;
 text-align:center;
 font-size:25px;font-weight:bold;
 pointer-events:auto;
}
#message button{margin-top:15px;padding:14px 25px}
#toast{
 position:absolute;top:105px;
 left:50%;transform:translateX(-50%);
 background:#101a22e8;
 border:1px solid #ffffff33;
 padding:10px 15px;border-radius:10px;
 font-size:12px;white-space:nowrap;
 opacity:0;transition:opacity .2s;
}
@media(max-height:650px){
 #stick{width:88px;height:88px}
 #knob{left:22px;top:22px}
 .shop button{padding:8px 5px}
 #hint{bottom:112px}
}
</style>
</head>

<body>
<div id="game"></div>

<div id="ui">
 <div class="top">
  <div class="panel">🪙 <span id="coins">250</span></div>
  <div class="panel">WAVE <span id="wave">1</span></div>
  <div class="panel">👥 <span id="army">1</span></div>
 </div>

 <div id="bars">
  <div class="barline">
   SOLDIER <div class="bar"><div class="fill" id="hpFill"></div></div>
   <span id="hpText">100</span>
  </div>
  <div class="barline">
   BASE <div class="bar"><div class="fill" id="baseFill"></div></div>
   <span id="baseText">300</span>
  </div>
  <div class="barline">
   WAVE <div class="bar"><div class="fill" id="waveFill"></div></div>
   <span id="progressText">0/10</span>
  </div>
 </div>

 <div id="toast"></div>

 <div id="hint">MOVE • AIM AUTOMATICALLY • DEFEND YOUR BASE</div>

 <div id="controls">
  <div id="stick"><div id="knob"></div></div>

  <div class="shop">
   <button class="gold" onclick="buildBarracks()">+ BARRACKS · 180</button>
   <button onclick="recruit()">RECRUIT · 100</button>
   <button onclick="upgrade()">DAMAGE · 100</button>
   <button onclick="repairBase()">REPAIR BASE · 60</button>
  </div>
 </div>

 <div id="message">
  <div>BASE DESTROYED</div>
  <div style="font-size:14px;margin-top:8px">The zombies took over your territory</div>
  <button class="gold" onclick="restartGame()">PLAY AGAIN</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b39a);
scene.fog=new THREE.Fog(0x91b39a,35,85);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
camera.position.set(0,19,23);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53634a,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-12,25,15);
scene.add(sun);

// TERRAIN
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(120,120),
 new THREE.MeshStandardMaterial({color:0x557b49})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
scene.add(ground);

// Ground details
const grassMat=new THREE.MeshStandardMaterial({color:0x668a52});
for(let i=0;i<180;i++){
 const x=(Math.random()-.5)*100;
 const z=(Math.random()-.5)*100;
 const patch=new THREE.Mesh(
  new THREE.CircleGeometry(.3+Math.random()*.5,5),
  grassMat
 );
 patch.rotation.x=-Math.PI/2;
 patch.position.set(x,-.105,z);
 scene.add(patch);
}

// ROAD
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(10,75),
 new THREE.MeshStandardMaterial({color:0x77796d})
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.09,-24);
scene.add(road);

// BUILDINGS
function building(x,z,color,width=5,depth=4){
 const g=new THREE.Group();

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(width,2.6,depth),
  new THREE.MeshStandardMaterial({color})
 );
 base.position.y=1.3;
 g.add(base);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(width+.35,.35,depth+.35),
  new THREE.MeshStandardMaterial({color:0x303b43})
 );
 roof.position.y=2.8;
 g.add(roof);

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(.9,1.7,.12),
  new THREE.MeshStandardMaterial({color:0x252b2c})
 );
 door.position.set(0,.85,depth/2+.07);
 g.add(door);

 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function makeHQ(){
 const g=building(0,-1,0x8d9a91,6,5);

 const sign=new THREE.Mesh(
  new THREE.BoxGeometry(2,.45,.15),
  new THREE.MeshStandardMaterial({color:0xd2a348})
 );
 sign.position.set(0,2.15,3.05);
 g.add(sign);

 const tower=new THREE.Mesh(
  new THREE.BoxGeometry(1.4,2.5,1.4),
  new THREE.MeshStandardMaterial({color:0x66747b})
 );
 tower.position.set(0,4.1,0);
 g.add(tower);

 return g;
}

const hq=makeHQ();

function makeBarracks(x,z){
 const g=building(x,z,0x687d83,4.5,4);

 const stripe=new THREE.Mesh(
  new THREE.BoxGeometry(4.55,.35,.2),
  new THREE.MeshStandardMaterial({color:0xd0a34e})
 );
 stripe.position.set(0,2,2.08);
 g.add(stripe);

 return g;
}

let barracks=[];
let barracksCount=1;
barracks.push(makeBarracks(-7,1));

// STORAGE
const storage=building(7,1,0x9b8254,4,4);

// WATCHTOWER
function tower(x,z){
 const g=new THREE.Group();

 const legs=new THREE.Mesh(
  new THREE.BoxGeometry(1.8,3,1.8),
  new THREE.MeshStandardMaterial({color:0x626c70})
 );
 legs.position.y=1.5;
 g.add(legs);

 const top=new THREE.Mesh(
  new THREE.BoxGeometry(3,1,3),
  new THREE.MeshStandardMaterial({color:0x3b454c})
 );
 top.position.y=3.5;
 g.add(top);

 g.position.set(x,0,z);
 scene.add(g);
 return g;
}
tower(-10,-7);
tower(10,-7);

// TREES
function tree(x,z){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.2,.3,1.5,7),
  new THREE.MeshStandardMaterial({color:0x66482c})
 );
 trunk.position.y=.75;
 g.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.25,8,7),
  new THREE.MeshStandardMaterial({color:0x315b37})
 );
 crown.position.y=2;
 g.add(crown);

 g.position.set(x,0,z);
 scene.add(g);
}

for(let i=0;i<55;i++){
 let x=(Math.random()-.5)*95;
 let z=(Math.random()-.5)*95;
 if(Math.abs(x)<15&&Math.abs(z)<13)continue;
 tree(x,z);
}

// CHARACTERS
function makeSoldier(color,x,z){
 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.7,1,.45),
  new THREE.MeshStandardMaterial({color})
 );
 body.position.y=.9;
 g.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,12),
  new THREE.MeshStandardMaterial({color:0xc99b72})
 );
 head.position.y=1.6;
 g.add(head);

 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.28,12,8),
  new THREE.MeshStandardMaterial({color:0x303c35})
 );
 helmet.scale.y=.5;
 helmet.position.y=1.76;
 g.add(helmet);

 const gun=new THREE.Mesh(
  new THREE.BoxGeometry(.14,.14,1),
  new THREE.MeshStandardMaterial({color:0x20252a})
 );
 gun.position.set(.35,1.05,-.45);
 g.add(gun);

 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function makeZombie(x,z){
 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.7,1.05,.45),
  new THREE.MeshStandardMaterial({color:0x668052})
 );
 body.position.y=.85;
 g.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.3,12,12),
  new THREE.MeshStandardMaterial({color:0x8d9b67})
 );
 head.position.y=1.58;
 g.add(head);

 const armMat=new THREE.MeshStandardMaterial({color:0x617a4d});

 for(let s of [-1,1]){
  const arm=new THREE.Mesh(
   new THREE.BoxGeometry(.2,.85,.22),armMat
  );
  arm.position.set(s*.48,.85,-.05);
  arm.rotation.z=s*.25;
  g.add(arm);
 }

 g.position.set(x,0,z);
 scene.add(g);

 g.userData.hp=50+wave*12;
 g.userData.speed=.025+wave*.0015;
 g.userData.attack=0;
 return g;
}

// GAME STATE
const saved=JSON.parse(localStorage.getItem("armyRushSave")||"{}");

let coins=saved.coins??250;
let wave=saved.wave??1;
let hp=saved.hp??100;
let baseHP=saved.baseHP??300;
let damage=saved.damage??25;
let soldierCount=saved.soldierCount??1;
let kills=0;
let dead=false;

const player=makeSoldier(0x315d9b,0,7);
let allies=[];
let enemies=[];
let bullets=[];

function createAlly(){
 const a=makeSoldier(0x477bb2,0,9);
 allies.push(a);
 return a;
}

for(let i=0;i<Math.min(soldierCount,8);i++)createAlly();

// UI
const $=id=>document.getElementById(id);

function updateUI(){
 $("coins").textContent=coins;
 $("wave").textContent=wave;
 $("army").textContent=soldierCount;
 $("hpText").textContent=Math.max(0,Math.floor(hp));
 $("baseText").textContent=Math.max(0,Math.floor(baseHP));

 $("hpFill").style.width=Math.max(0,hp)+"%";
 $("baseFill").style.width=Math.max(0,baseHP/3)+"%";

 $("progressText").textContent=kills+"/"+(wave*10);
 $("waveFill").style.width=(kills/(wave*10)*100)+"%";
}

function saveGame(){
 localStorage.setItem("armyRushSave",JSON.stringify({
  coins,wave,hp,baseHP,damage,soldierCount
 }));
}

setInterval(saveGame,3000);

// NOTIFICATIONS
let toastTimer;
function toast(message){
 const el=$("toast");
 el.textContent=message;
 el.style.opacity=1;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.opacity=0,1800);
}

// BUILDINGS AND RECRUITMENT
function buildBarracks(){
 if(coins<180){toast("NOT ENOUGH COINS");return;}
 if(barracksCount>=6){toast("MAXIMUM BARRACKS");return;}

 coins-=180;
 barracksCount++;

 const positions=[
  [-7,1],[7,7],[-7,8],[12,2],[-12,2]
 ];
 const p=positions[barracksCount-2];
 barracks.push(makeBarracks(p[0],p[1]));

 toast("BARRACKS BUILT");
 updateUI();saveGame();
}

function recruit(){
 if(coins<100){toast("NOT ENOUGH COINS");return;}
 if(soldierCount>=8){toast("ARMY LIMIT REACHED");return;}

 coins-=100;
 soldierCount++;
 createAlly();

 toast("SOLDIER RECRUITED");
 updateUI();saveGame();
}

function upgrade(){
 if(coins<100){toast("NOT ENOUGH COINS");return;}
 coins-=100;
 damage+=10;
 toast("WEAPON DAMAGE INCREASED");
 updateUI();saveGame();
}

function repairBase(){
 if(coins<60){toast("NOT ENOUGH COINS");return;}
 if(baseHP>=300){toast("BASE IS ALREADY FULL");return;}

 coins-=60;
 baseHP=Math.min(300,baseHP+60);
 toast("BASE REPAIRED");
 updateUI();saveGame();
}

// JOYSTICK
const stick=$("stick");
const knob=$("knob");

let active=false;
let moveX=0,moveY=0;
let center={x:0,y:0};

function pointerStart(e){
 active=true;
 const r=stick.getBoundingClientRect();
 center={x:r.left+r.width/2,y:r.top+r.height/2};
 pointerMove(e);
}

function pointerMove(e){
 if(!active)return;

 const dx=e.clientX-center.x;
 const dy=e.clientY-center.y;
 const len=Math.max(1,Math.hypot(dx,dy));

 moveX=dx/Math.max(45,len);
 moveY=dy/Math.max(45,len);

 knob.style.left=(30+moveX*32)+"px";
 knob.style.top=(30+moveY*32)+"px";
}

function pointerEnd(){
 active=false;
 moveX=0;moveY=0;
 knob.style.left="30px";
 knob.style.top="30px";
}

stick.addEventListener("pointerdown",e=>{
 stick.setPointerCapture(e.pointerId);
 pointerStart(e);
});
stick.addEventListener("pointermove",pointerMove);
stick.addEventListener("pointerup",pointerEnd);
stick.addEventListener("pointercancel",pointerEnd);

// COMBAT
function spawnZombie(){
 const side=Math.floor(Math.random()*4);
 let x=0,z=0;

 if(side===0){x=-30+Math.random()*60;z=-30;}
 if(side===1){x=-30+Math.random()*60;z=30;}
 if(side===2){x=-30;z=-30+Math.random()*60;}
 if(side===3){x=30;z=-30+Math.random()*60;}

 enemies.push(makeZombie(x,z));
}

function nearest(from){
 let best=null;
 let dist=Infinity;

 enemies.forEach(e=>{
  const d=from.position.distanceTo(e.position);
  if(d<dist){dist=d;best=e;}
 });

 return best;
}

function shoot(from,target){
 const start=from.position.clone();
 start.y=1.05;

 const b=new THREE.Mesh(
  new THREE.SphereGeometry(.1,8,8),
  new THREE.MeshBasicMaterial({color:0xffd66b})
 );

 b.position.copy(start);
 scene.add(b);

 bullets.push({
  mesh:b,
  target,
  damage,
  speed:.85
 });
}

function removeZombie(z){
 scene.remove(z);
 enemies=enemies.filter(e=>e!==z);

 coins+=15;
 kills++;

 if(kills>=wave*10){
  kills=0;
  wave++;
  toast("WAVE "+wave+" INCOMING!");
 }

 updateUI();
}

// MAIN LOOP
let lastShot=0;
let spawnTimer=0;
let lastTime=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-lastTime)/16.67,2);
 lastTime=now;

 if(!dead){

  // PLAYER MOVEMENT
  player.position.x+=moveX*.14*dt;
  player.position.z+=moveY*.14*dt;

  player.position.x=Math.max(-27,Math.min(27,player.position.x));
  player.position.z=Math.max(-27,Math.min(27,player.position.z));

  // CAMERA FOLLOWS PLAYER
  camera.position.x+=(player.position.x-camera.position.x)*.045;
  camera.position.z+=(player.position.z+16-camera.position.z)*.045;
  camera.lookAt(player.position.x,0,player.position.z-5);

  // ALLIES FOLLOW PLAYER
  allies.forEach((a,i)=>{
   const col=i%3;
   const row=Math.floor(i/3);
   const tx=player.position.x+(col-1)*1.7;
   const tz=player.position.z+2+row*1.7;

   a.position.x+=(tx-a.position.x)*.07;
   a.position.z+=(tz-a.position.z)*.07;

   const target=nearest(a);
   if(target&&Date.now()-(a.userData.lastShot||0)>1100){
    shoot(a,target);
    a.userData.lastShot=Date.now();
   }
  });

  // PLAYER AUTO FIRE
  if(Date.now()-lastShot>650){
   const target=nearest(player);
   if(target&&player.position.distanceTo(target.position)<17){
    shoot(player,target);
    lastShot=Date.now();
   }
  }

  // ZOMBIE SPAWN
  spawnTimer+=dt;
  const interval=Math.max(24,100-wave*4);

  if(spawnTimer>interval){
   spawnZombie();
   spawnTimer=0;
  }

  // BULLETS
  for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];

   if(!enemies.includes(b.target)){
    scene.remove(b.mesh);
    bullets.splice(i,1);
    continue;
   }

   const destination=b.target.position.clone();
   destination.y=1;

   const dir=destination.sub(b.mesh.position).normalize();
   b.mesh.position.addScaledVector(dir,b.speed*dt);

   if(b.mesh.position.distanceTo(b.target.position.clone().add(new THREE.Vector3(0,1,0)))<.8){
    b.target.userData.hp-=b.damage;
    scene.remove(b.mesh);
    bullets.splice(i,1);

    if(b.target.userData.hp<=0)removeZombie(b.target);
   }
  }

  // ZOMBIE MOVEMENT AND ATTACK
  for(let i=enemies.length-1;i>=0;i--){
   const z=enemies[i];

   const target=new THREE.Vector3(0,0,-1);
   const dist=z.position.distanceTo(target);

   if(dist>5){
    const dir=target.clone().sub(z.position).normalize();
    z.position.addScaledVector(dir,z.userData.speed*dt);
    z.rotation.y=Math.atan2(-dir.x,-dir.z);
   }else{
    if(Date.now()-z.userData.attack>900){
     baseHP-=3;
     z.userData.attack=Date.now();
     updateUI();
    }
   }

   // Player can also be attacked
   if(z.position.distanceTo(player.position)<1.3){
    hp-=.12*dt;
    updateUI();
   }
  }

  if(baseHP<=0||hp<=0){
   dead=true;
   $("message").style.display="flex";
   saveGame();
  }
 }

 renderer.render(scene,camera);
}

function restartGame(){
 localStorage.removeItem("armyRushSave");
 location.reload();
}

updateUI();
animate(performance.now());

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
